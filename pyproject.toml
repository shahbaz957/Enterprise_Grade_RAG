[project]
name = "enterprise-rag-backend"
version = "0.1.0"
description = "Enterprise RAG FastAPI backend (OpenAI embeddings, OpenAI/Groq inference, Qdrant)"
readme = "README.md"
authors = [
    { name = "Mirza Shahbaz Ali Baig", email = "mirzashahbazbaig724@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "flashrank>=0.2.10",
    "groq>=0.37.1",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "logfire[fastapi]>=4.39.0",
    "lxml>=6.1.1",
    "nemoguardrails>=0.23.0",
    "openai>=2.51.0",
    "pdfplumber>=0.11.10",
    "portkey-ai>=2.3.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "qdrant-client>=1.18.0",
    "ragas>=0.4.3",
    "sentence-transformers>=5.6.1",
    "uvicorn[standard]>=0.52.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"
